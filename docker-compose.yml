services:
  postgres:
    image: postgres:16
    container_name: docspace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docspace
      POSTGRES_PASSWORD: docspace
      POSTGRES_DB: docspace
    ports:
      - "5432:5432"
    volumes:
      - docspace_pgdata:/var/lib/postgresql/data
    networks:
      - docspace_net

  redis:
    image: redis:7-alpine
    container_name: docspace_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - docspace_redisdata:/data
    networks:
      - docspace_net

  nginx:
    image: nginx:1.27-alpine
    container_name: docspace_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Make the docker host reachable as host.docker.internal from
    # inside this container. Docker Desktop sets this for the
    # default bridge network automatically, but a user-defined
    # network (docspace_net) needs the explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - docspace_net

volumes:
  docspace_pgdata:
  docspace_redisdata:

networks:
  docspace_net:
    driver: bridge
