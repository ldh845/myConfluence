# Cycle 46 — 로그 로테이션 기본값. 모든 서비스가 동일 정책 사용.
# 서비스당 한도: 10MB × 5 = 50MB. 초과 시 가장 오래된 것부터 회전.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    container_name: docspace_postgres
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-docspace}
      # Cycle 46 — 비번 외부화. 루트 .env 의 POSTGRES_PASSWORD 필수(:?required → 미설정 시 즉시 실패).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: ${DB_NAME:-docspace}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - docspace_pgdata:/var/lib/postgresql/data
    networks:
      - docspace_net

  # Cycle 42 — API(NestJS REST :3001 + Hocuspocus :1234) 컨테이너.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # 사내 프록시 — 빌드 호스트 환경변수에서 전달(값 하드코딩 금지). 미설정 시 빈 값.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: docspace_api
    logging: *default-logging
    restart: unless-stopped
    environment:
      # DB 접속 정보 — 개별 변수로 분리. AFS(K8s) 환경에서 Secret 관리 용이.
      # DATABASE_URL은 Prisma가 env("DATABASE_URL")로 읽으므로 유지하되 조립 방식으로 생성.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-docspace}
      DB_USER: ${DB_USER:-docspace}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.example)}
      DATABASE_URL: postgresql://${DB_USER:-docspace}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-docspace}?schema=public
      PORT: "3001"
      USE_REDIS: "false"
      # Keycloak 연동 값 — Cycle 43부터 실사용. 지금은 placeholder.
      KC_ISSUER_URI: http://keycloak:8080/realms/docspace
      KC_CLIENT_ID: docspace-web
      KC_CLIENT_SECRET: dev-docspace-secret
    depends_on:
      - postgres
    ports:
      - "3001:3001"   # Next.js 프록시 대상 (web 컨테이너가 서비스명 api 로 접속)
      - "1234:1234"   # Hocuspocus WebSocket — 브라우저가 직접 접속
    networks:
      - docspace_net

  # Cycle 42 — Next.js 14 standalone 컨테이너.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 빌드타임 주입 — rewrites/NEXT_PUBLIC_* 는 빌드 시점에 굳는다.
        API_HOST: api
        API_PORT: "3001"
        # 브라우저가 직접 붙는 Hocuspocus 주소. 환경마다 달라야 하므로
        # 환경변수로 통제(Cycle 40 패턴). 미설정 시 로컬 기본값.
        # VM 배포: 루트 .env 에 NEXT_PUBLIC_WS_URL=ws://<VM_IP>:1234 지정.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:1234}
        # 사내 프록시 — 빌드 호스트 환경변수에서 전달(값 하드코딩 금지).
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: docspace_web
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - docspace_net

  # Cycle 42 — 개발용 Keycloak. start-dev = 인메모리 H2(재시작 시 소실)지만
  # --import-realm 으로 매 기동마다 realm-docspace 를 복구하므로 개발엔 충분.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: docspace_keycloak
    logging: *default-logging
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-docspace.json:/opt/keycloak/data/import/realm-docspace.json:ro
    networks:
      - docspace_net

  redis:
    image: redis:7-alpine
    container_name: docspace_redis
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - docspace_redisdata:/data
    networks:
      - docspace_net

  nginx:
    image: nginx:1.27-alpine
    container_name: docspace_nginx
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Make the docker host reachable as host.docker.internal from
    # inside this container. Docker Desktop sets this for the
    # default bridge network automatically, but a user-defined
    # network (docspace_net) needs the explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - docspace_net

volumes:
  docspace_pgdata:
  docspace_redisdata:

networks:
  docspace_net:
    driver: bridge