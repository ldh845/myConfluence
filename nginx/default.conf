# Cycle 5-2: dev-time reverse proxy.
# Nginx listens on :80 and forwards everything to the host-side
# Next.js dev server (:3000). Next.js itself rewrites /api/* to the
# host-side NestJS (:3001). The Yjs/Hocuspocus WebSocket stays on
# :1234 with a direct connection from the browser; routing it
# through Nginx is a later cycle.
#
# Connection upgrade map must live in the http context. Files under
# /etc/nginx/conf.d/*.conf are included inside http {} so this works.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web {
    server host.docker.internal:3000;
}

server {
    listen 80;
    server_name localhost;

    # Forward proxy hints + preserve WebSocket Upgrade so Next.js
    # HMR (which uses ws on :3000) keeps working through Nginx.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://web;
    }
}
